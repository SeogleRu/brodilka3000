<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бродилка3000</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; touch-action: none; user-select: none; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;
            font-size: 14px; z-index: 10; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 20;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.9);
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
        #crosshair::after { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }

        /* ===== ДЖОЙСТИК ===== */
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px;
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            touch-action: none; z-index: 30;
            backdrop-filter: blur(4px);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 64px; height: 64px;
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            pointer-events: none;
            transition: none;
        }
        /* Стрелочки-подсказки на джойстике */
        .joy-arrow {
            position: absolute; color: rgba(255,255,255,0.6);
            font-size: 18px; font-weight: bold; pointer-events: none;
        }
        .joy-up    { top: 5px; left: 50%; transform: translateX(-50%); }
        .joy-down  { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .joy-left  { left: 8px; top: 50%; transform: translateY(-50%); }
        .joy-right { right: 8px; top: 50%; transform: translateY(-50%); }

        /* ===== КНОПКА БЛОКА ===== */
        #place-btn {
            position: absolute; bottom: 50px; right: 40px;
            width: 90px; height: 90px;
            background: rgba(255, 165, 0, 0.85);
            border-radius: 50%; border: 3px solid white;
            color: white; font-size: 16px; font-weight: bold;
            text-shadow: 1px 1px 3px black;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 30; touch-action: none; cursor: pointer;
        }
        #place-btn:active { transform: scale(0.92); background: rgba(255,200,0,0.95); }

        #desktop-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.4);
            padding: 6px 16px; border-radius: 20px; font-size: 14px;
            z-index: 10; pointer-events: none;
        }
        @media (max-width: 768px) { #desktop-hint { display: none; } }
    </style>
</head>
<body>
    <div id="info">Бродилка3000 | Блоков: <span id="blockCount">0</span></div>
    <div id="crosshair"></div>

    <div id="joystick-base">
        <span class="joy-arrow joy-up">▲</span>
        <span class="joy-arrow joy-down">▼</span>
        <span class="joy-arrow joy-left">◀</span>
        <span class="joy-arrow joy-right">▶</span>
        <div id="joystick-knob"></div>
    </div>

    <div id="place-btn">БЛОК</div>

    <div id="desktop-hint">WASD - движение | Зажми ЛКМ - поворот | ЛКМ/ПРОБЕЛ - блок</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ================= СЦЕНА =================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ================= СВЕТ =================
        scene.add(new THREE.AmbientLight(0x606080));

        const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.2);
        sunLight.position.set(30, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(1024, 1024);
        const dd = 50;
        Object.assign(sunLight.shadow.camera, {
            left: -dd, right: dd, top: dd, bottom: -dd, near: 1, far: 100
        });
        scene.add(sunLight);

        // ================= ЗЕМЛЯ =================
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x3a6b3a, roughness: 0.85 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        scene.add(new THREE.GridHelper(200, 50, 0x888888, 0x444444));

        // ================= ЗДАНИЯ =================
        function createBuilding(x, z, w, d, h, color) {
            const b = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color, roughness: 0.5 })
            );
            b.position.set(x, h / 2, z);
            b.castShadow = true; b.receiveShadow = true;
            scene.add(b);

            const winMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0x332200 });
            const cols = Math.floor(w / 1.5), rows = Math.floor(h / 1.5);
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    if (Math.random() > 0.4) {
                        const win = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.1), winMat);
                        win.position.set(
                            x - w/2 + 0.8 + i*1.5,
                            0.8 + j*1.5,
                            z + d/2 + 0.05
                        );
                        scene.add(win);
                    }
                }
            }
        }

        const colors = [0x8B4513, 0xA0522D, 0xCD853F, 0x6B8E23, 0x4682B4, 0x5F9EA0, 0xB8860B, 0x8FBC8F];
        const posArr = [
            [-15,-15],[15,-15],[-15,15],[15,15],
            [-25,0],[25,0],[0,-25],[0,25],
            [-30,-20],[30,-20],[-30,20],[30,20],
            [-20,-30],[20,-30],[-20,30],[20,30]
        ];
        posArr.forEach(([x,z]) => createBuilding(
            x, z,
            2 + Math.random()*3,
            2 + Math.random()*3,
            3 + Math.random()*7,
            colors[Math.floor(Math.random()*colors.length)]
        ));

        // ================= ИГРОК =================
        const player = {
            height: 1.7,
            speed: 5.5,
            position: new THREE.Vector3(0, 0, 0),
            yaw: 0,     // поворот влево/вправо
            pitch: 0    // наклон вверх/вниз
        };

        // ================= ВВОД =================
        const keys = { w: false, a: false, s: false, d: false, space: false };

        // ========== ДЖОЙСТИК (правильное направление) ==========
        const joyBase = document.getElementById('joystick-base');
        const joyKnob = document.getElementById('joystick-knob');
        const JOY_RADIUS = 55; // максимальное отклонение кноба

        // input: x (-1 влево .. +1 вправо), y (-1 назад .. +1 вперёд)
        const joystick = { x: 0, y: 0, active: false, id: null, cx: 0, cy: 0 };

        function setKnob(dx, dy) {
            const dist = Math.hypot(dx, dy);
            const clamped = Math.min(dist, JOY_RADIUS);
            const ang = Math.atan2(dy, dx);
            const kx = Math.cos(ang) * clamped;
            const ky = Math.sin(ang) * clamped;
            joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;

            // ВАЖНО: экранный Y растёт вниз, а нам нужно "вверх = вперёд"
            joystick.x = kx / JOY_RADIUS;   // -1 (влево) .. +1 (вправо)
            joystick.y = -ky / JOY_RADIUS;  // -1 (назад) .. +1 (вперёд)
        }

        function resetJoystick() {
            joystick.x = 0; joystick.y = 0;
            joystick.active = false; joystick.id = null;
            joyKnob.style.transform = 'translate(-50%, -50%)';
        }

        joyBase.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            const t = e.changedTouches[0];
            const r = joyBase.getBoundingClientRect();
            joystick.cx = r.left + r.width / 2;
            joystick.cy = r.top + r.height / 2;
            joystick.active = true;
            joystick.id = t.identifier;
            setKnob(t.clientX - joystick.cx, t.clientY - joystick.cy);
        }, { passive: false });

        joyBase.addEventListener('touchmove', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (!joystick.active) return;
            for (const t of e.changedTouches) {
                if (t.identifier === joystick.id) {
                    setKnob(t.clientX - joystick.cx, t.clientY - joystick.cy);
                    break;
                }
            }
        }, { passive: false });

        const joyEnd = (e) => {
            e.preventDefault(); e.stopPropagation();
            resetJoystick();
        };
        joyBase.addEventListener('touchend', joyEnd);
        joyBase.addEventListener('touchcancel', joyEnd);

        // ========== СВАЙП ДЛЯ ПОВОРОТА КАМЕРЫ (правая половина экрана) ==========
        let lookId = null, lookX = 0, lookY = 0;

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.target.closest('#joystick-base') || e.target.closest('#place-btn')) return;
            for (const t of e.changedTouches) {
                if (t.identifier !== joystick.id && lookId === null) {
                    lookId = t.identifier;
                    lookX = t.clientX;
                    lookY = t.clientY;
                    break;
                }
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (lookId === null) return;
            for (const t of e.changedTouches) {
                if (t.identifier === lookId) {
                    const dx = t.clientX - lookX;
                    const dy = t.clientY - lookY;
                    player.yaw   -= dx * 0.006;
                    player.pitch -= dy * 0.006;
                    player.pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, player.pitch));
                    lookX = t.clientX;
                    lookY = t.clientY;
                    e.preventDefault();
                    break;
                }
            }
        }, { passive: false });

        const lookEnd = (e) => {
            for (const t of e.changedTouches) {
                if (t.identifier === lookId) { lookId = null; break; }
            }
        };
        renderer.domElement.addEventListener('touchend', lookEnd);
        renderer.domElement.addEventListener('touchcancel', lookEnd);

        // ========== МЫШЬ (ПК) ==========
        let mouseDown = false, mx = 0, my = 0;
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            if (e.target.closest('#place-btn')) return;
            mouseDown = true; mx = e.clientX; my = e.clientY;
        });
        addEventListener('mouseup', () => mouseDown = false);
        addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const dx = e.clientX - mx, dy = e.clientY - my;
            player.yaw   -= dx * 0.005;
            player.pitch -= dy * 0.005;
            player.pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, player.pitch));
            mx = e.clientX; my = e.clientY;
        });

        // ========== КЛАВИАТУРА ==========
        addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'ц') keys.w = true;
            if (k === 'a' || k === 'ф') keys.a = true;
            if (k === 's' || k === 'ы') keys.s = true;
            if (k === 'd' || k === 'в') keys.d = true;
            if (k === ' ' && !keys.space) { keys.space = true; placeBlock(); e.preventDefault(); }
        });
        addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'ц') keys.w = false;
            if (k === 'a' || k === 'ф') keys.a = false;
            if (k === 's' || k === 'ы') keys.s = false;
            if (k === 'd' || k === 'в') keys.d = false;
            if (k === ' ') keys.space = false;
        });

        // ================= БЛОКИ =================
        const blocks = [];
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        const blockMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0x442200 });

        const raycaster = new THREE.Raycaster();
        const centerNDC = new THREE.Vector2(0, 0);

        function placeBlock() {
            raycaster.setFromCamera(centerNDC, camera);
            const targets = [ground, ...scene.children.filter(c =>
                c.isMesh && c !== ground && !blocks.includes(c)
            )];
            const hits = raycaster.intersectObjects(targets, true);
            if (!hits.length) return;

            const hit = hits[0];
            const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
            const p = hit.point.clone().add(normal.multiplyScalar(0.5));

            const grid = new THREE.Vector3(Math.round(p.x), Math.round(p.y), Math.round(p.z));
            if (grid.y < 0.5 || grid.y > 25) return;
            if (blocks.some(b => b.position.distanceTo(grid) < 0.1)) return;

            const b = new THREE.Mesh(blockGeo, blockMat.clone());
            b.position.copy(grid);
            b.castShadow = true; b.receiveShadow = true;
            scene.add(b);
            blocks.push(b);
            document.getElementById('blockCount').textContent = blocks.length;
        }

        const placeBtn = document.getElementById('place-btn');
        placeBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation(); placeBlock();
        }, { passive: false });
        placeBtn.addEventListener('mousedown', (e) => {
            e.preventDefault(); e.stopPropagation(); placeBlock();
        });

        // ================= RESIZE =================
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // ================= ИГРОВОЙ ЦИКЛ =================
        let last = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - last) / 1000, 0.05);
            last = now;

            // --- Ввод направления (X — стрейф, Y — вперёд) ---
            let inX = 0, inY = 0;

            if (keys.w) inY += 1;
            if (keys.s) inY -= 1;
            if (keys.d) inX += 1;
            if (keys.a) inX -= 1;

            if (joystick.active) {
                inX += joystick.x;
                inY += joystick.y;
            }

            // Ограничение по длине (чтобы по диагонали не было быстрее)
            const mag = Math.hypot(inX, inY);
            if (mag > 1) { inX /= mag; inY /= mag; }

            // --- Направление "вперёд" и "вправо" относительно камеры (по горизонтали) ---
            const forwardX = Math.sin(player.yaw);
            const forwardZ = Math.cos(player.yaw);
            const rightX = Math.cos(player.yaw);
            const rightZ = -Math.sin(player.yaw);

            const speed = player.speed * dt;
            // ВАЖНО: inY — вперёд, inX — вправо
            const moveX = (forwardX * inY + rightX * inX) * speed;
            const moveZ = (forwardZ * inY + rightZ * inX) * speed;

            const newPos = player.position.clone();
            newPos.x += moveX;
            newPos.z += moveZ;

            // --- Коллизии с блоками ---
            let hitBlock = false;
            for (const b of blocks) {
                const bp = b.position;
                if (Math.abs(newPos.x - bp.x) < 0.85 &&
                    Math.abs(newPos.z - bp.z) < 0.85 &&
                    Math.abs(player.height - bp.y) < 1.2) {
                    hitBlock = true;
                    break;
                }
            }
            if (!hitBlock) player.position.copy(newPos);

            // Границы карты
            player.position.x = Math.max(-48, Math.min(48, player.position.x));
            player.position.z = Math.max(-48, Math.min(48, player.position.z));

            // --- Камера ---
            camera.position.set(player.position.x, player.height, player.position.z);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
