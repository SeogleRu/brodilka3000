<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Бродилка3000 - Мультиплеер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; font-family: Arial, sans-serif; }
  canvas { display: block; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 40px; height: 40px;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 20;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.95);
    box-shadow: 0 0 6px rgba(0,0,0,1);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
  #crosshair::after { top: 50%; left: 0; width: 100%; height: 2px; margin-top: -1px; }

  #info {
    position: fixed; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 20px;
    font-size: 14px; z-index: 10; pointer-events: none;
  }

  #joy {
    position: fixed; left: 20px; bottom: 20px;
    width: 150px; height: 150px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35);
    z-index: 40; touch-action: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%;
    width: 70px; height: 70px;
    margin-left: -35px; margin-top: -35px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff, #b8b8b8);
    border: 2px solid rgba(255,255,255,0.9);
    pointer-events: none;
    will-change: transform;
  }

  #placeBtn {
    position: fixed; right: 25px; bottom: 30px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffbb33, #d97706);
    border: 3px solid #fff;
    color: #fff; font-size: 16px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    z-index: 40; touch-action: none; user-select: none;
  }
  #placeBtn.pressed { transform: scale(0.92); }

  #hint {
    position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.75); background: rgba(0,0,0,0.5);
    padding: 6px 16px; border-radius: 20px; font-size: 13px;
    z-index: 10; pointer-events: none;
  }
  @media (pointer: coarse) { #hint { display: none; } }
  @media (pointer: fine) { #joy, #placeBtn { display: none; } }

  /* Экран входа */
  #loginScreen {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; color: #fff; font-family: Arial, sans-serif;
  }
  #loginScreen h1 { font-size: 28px; margin-bottom: 20px; }
  #loginScreen p { font-size: 14px; margin-bottom: 30px; opacity: 0.8; text-align: center; max-width: 300px; }
  #roomInput {
    width: 260px; padding: 15px; font-size: 18px; text-align: center;
    border: 2px solid #ffbb33; border-radius: 10px;
    background: rgba(255,255,255,0.1); color: #fff; margin-bottom: 20px;
  }
  #roomInput::placeholder { color: rgba(255,255,255,0.4); }
  #joinBtn {
    padding: 15px 50px; font-size: 18px; font-weight: bold;
    background: radial-gradient(circle at 35% 35%, #ffbb33, #d97706);
    border: 3px solid #fff; border-radius: 50px; color: #fff;
    cursor: pointer; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  }
  #joinBtn:active { transform: scale(0.95); }
  #status { margin-top: 20px; font-size: 14px; opacity: 0.7; }
</style>
</head>
<body>

<!-- Экран входа -->
<div id="loginScreen">
  <h1>Бродилка3000 по сети</h1>
  <p>Введите код комнаты и передайте его другу. Оба должны ввести одинаковый код.</p>
  <input id="roomInput" type="text" placeholder="Код комнаты" value="room123">
  <button id="joinBtn">ВОЙТИ</button>
  <div id="status">Не подключено</div>
</div>

<div id="crosshair"></div>
<div id="info">Бродилка3000 | Блоков: <span id="count">0</span> | Игроков: <span id="playerCount">1</span></div>
<div id="joy"><div id="joyKnob"></div></div>
<div id="placeBtn">БЛОК</div>
<div id="hint">WASD — движение · Зажми ЛКМ — поворот · ПРОБЕЛ — блок</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
    "trystero": "https://esm.run/trystero"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { joinRoom } from 'trystero';

/* ============================ СЦЕНА ============================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 40, 120);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ============================ СВЕТ ============================ */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const sun = new THREE.DirectionalLight(0xfff2cc, 1.1);
sun.position.set(40, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 150;
scene.add(sun);
scene.add(sun.target);

/* ============================ ЗЕМЛЯ ============================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x4a7c4a, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(300, 150, 0x666666, 0x333333);
grid.material.opacity = 0.35;
grid.material.transparent = true;
scene.add(grid);

/* ============================ ЗДАНИЯ ============================ */
function makeBuilding(x, z, w, h, d, color) {
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
  );
  b.position.set(x, h / 2, z);
  b.castShadow = true;
  b.receiveShadow = true;
  scene.add(b);
}

const palette = [0xb5651d, 0xc68642, 0x8b5a2b, 0x6b8e23, 0x4682b4, 0x5f9ea0, 0xa0522d, 0xcd853f];
const spots = [];
for (let ring = 1; ring <= 3; ring++) {
  const r = ring * 14;
  const n = ring * 6;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + ring * 0.3;
    spots.push([Math.cos(a) * r + (Math.random()-0.5)*4, Math.sin(a) * r + (Math.random()-0.5)*4]);
  }
}
spots.forEach(([x, z]) => {
  if (Math.hypot(x, z) < 8) return;
  makeBuilding(x, z,
    3 + Math.random() * 4,
    4 + Math.random() * 9,
    3 + Math.random() * 4,
    palette[Math.floor(Math.random() * palette.length)]);
});

/* ============================ ИГРОК ============================ */
const player = {
  height: 1.7,
  radius: 0.4,
  speed: 5.5,
  pos: new THREE.Vector3(0, 0, 0),
  yaw: 0,
  pitch: 0
};
const PITCH_LIMIT = Math.PI / 2.2;

/* ============================ МУЛЬТИПЛЕЕР ============================ */
let room = null;
let myPeerId = null;
const otherPlayers = {}; // peerId -> { mesh, targetX, targetY, targetZ, targetYaw }
let isConnected = false;
let sendPosition = null;

// Создание квадратного человечка
function createPlayerMesh(color = 0xe74c3c) {
  const group = new THREE.Group();

  // Тело (торс)
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.7, 0.3),
    new THREE.MeshStandardMaterial({ color })
  );
  body.position.y = 1.05;
  body.castShadow = true;
  group.add(body);

  // Голова
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.4, 0.4),
    new THREE.MeshStandardMaterial({ color: 0xf0c8a0 })
  );
  head.position.y = 1.6;
  head.castShadow = true;
  group.add(head);

  // Ноги
  const legL = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 0.6, 0.18),
    new THREE.MeshStandardMaterial({ color: 0x2c3e50 })
  );
  legL.position.set(-0.15, 0.4, 0);
  legL.castShadow = true;
  group.add(legL);

  const legR = legL.clone();
  legR.position.x = 0.15;
  group.add(legR);

  // Руки
  const armL = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 0.55, 0.15),
    new THREE.MeshStandardMaterial({ color })
  );
  armL.position.set(-0.35, 1.05, 0);
  armL.castShadow = true;
  group.add(armL);

  const armR = armL.clone();
  armR.position.x = 0.35;
  group.add(armR);

  return group;
}

function updatePlayerCount() {
  document.getElementById('playerCount').textContent = 1 + Object.keys(otherPlayers).length;
}

// Подключение к комнате
function connectToRoom(roomCode) {
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Подключение...';

  room = joinRoom({ appId: 'my-3d-city-game' }, roomCode);

  // Настройка действия для передачи позиции
  [sendPosition] = room.makeAction('pos');

  // Обработка существующих игроков (при подключении)
  room.onPeerJoin(peerId => {
    console.log('Игрок присоединился:', peerId);

    if (!otherPlayers[peerId]) {
      const mesh = createPlayerMesh(0xe74c3c);
      scene.add(mesh);
      otherPlayers[peerId] = {
        mesh,
        targetX: 0,
        targetY: 0,
        targetZ: 0,
        targetYaw: 0
      };
      updatePlayerCount();
    }
  });

  room.onPeerLeave(peerId => {
    console.log('Игрок отключился:', peerId);
    if (otherPlayers[peerId]) {
      scene.remove(otherPlayers[peerId].mesh);
      delete otherPlayers[peerId];
      updatePlayerCount();
    }
  });

  // Получение позиции других игроков
  room.onMessage((data, peerId) => {
    if (otherPlayers[peerId]) {
      otherPlayers[peerId].targetX = data.x;
      otherPlayers[peerId].targetY = data.y;
      otherPlayers[peerId].targetZ = data.z;
      otherPlayers[peerId].targetYaw = data.yaw;
    }
  });

  // Получаем свой ID
  myPeerId = room.selfId;

  // Скрываем экран входа
  document.getElementById('loginScreen').style.display = 'none';
  isConnected = true;

  console.log('Подключен к комнате:', roomCode, 'Мой ID:', myPeerId);
  statusEl.textContent = 'Подключено!';
}

// Обработка кнопки входа
document.getElementById('joinBtn').addEventListener('click', () => {
  const roomCode = document.getElementById('roomInput').value.trim();
  if (!roomCode) {
    alert('Введите код комнаты');
    return;
  }
  connectToRoom(roomCode);
});

// Разрешаем Enter в поле ввода
document.getElementById('roomInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('joinBtn').click();
  }
});

/* ============================ КЛАВИАТУРА ============================ */
const keys = { w: false, a: false, s: false, d: false };

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц' || k === 'arrowup') keys.w = true;
  if (k === 'a' || k === 'ф' || k === 'arrowleft') keys.a = true;
  if (k === 's' || k === 'ы' || k === 'arrowdown') keys.s = true;
  if (k === 'd' || k === 'в' || k === 'arrowright') keys.d = true;
  if (k === ' ') { e.preventDefault(); placeBlock(); }
});
addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц' || k === 'arrowup') keys.w = false;
  if (k === 'a' || k === 'ф' || k === 'arrowleft') keys.a = false;
  if (k === 's' || k === 'ы' || k === 'arrowdown') keys.s = false;
  if (k === 'd' || k === 'в' || k === 'arrowright') keys.d = false;
});

/* ============================ ДЖОЙСТИК ============================ */
const joyEl = document.getElementById('joy');
const joyKnob = document.getElementById('joyKnob');
const JOY_RADIUS = 55;

const joy = {
  active: false,
  touchId: null,
  forward: 0,
  strafe: 0
};

function joyUpdate(clientX, clientY) {
  const r = joyEl.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;

  let dx = clientX - cx;
  let dy = clientY - cy;

  const len = Math.hypot(dx, dy);
  if (len > JOY_RADIUS) {
    dx = dx / len * JOY_RADIUS;
    dy = dy / len * JOY_RADIUS;
  }

  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;

  // ВВЕРХ (dy<0) → forward>0 → вперёд
  joy.forward = -dy / JOY_RADIUS;
  // ВПРАВО (dx>0) → strafe>0 → вправо
  joy.strafe = dx / JOY_RADIUS;
}

function joyStop() {
  joy.active = false;
  joy.touchId = null;
  joy.forward = 0;
  joy.strafe = 0;
  joyKnob.style.transform = 'translate(0px, 0px)';
}

joyEl.addEventListener('touchstart', (e) => {
  e.preventDefault(); e.stopPropagation();
  const t = e.changedTouches[0];
  joy.active = true;
  joy.touchId = t.identifier;
  joyUpdate(t.clientX, t.clientY);
}, { passive: false });

joyEl.addEventListener('touchmove', (e) => {
  e.preventDefault(); e.stopPropagation();
  if (!joy.active) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joy.touchId) {
      joyUpdate(t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

const joyEnd = (e) => {
  e.preventDefault(); e.stopPropagation();
  if (joy.active) joyStop();
};
joyEl.addEventListener('touchend', joyEnd);
joyEl.addEventListener('touchcancel', joyEnd);

/* ============================ ПОВОРОТ КАМЕРЫ СВАЙПОМ ============================ */
let lookId = null, lookX = 0, lookY = 0;

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.target.closest('#joy') || e.target.closest('#placeBtn')) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== joy.touchId && lookId === null) {
      lookId = t.identifier;
      lookX = t.clientX; lookY = t.clientY;
      break;
    }
  }
}, { passive: false });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (lookId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === lookId) {
      const dx = t.clientX - lookX;
      const dy = t.clientY - lookY;
      player.yaw   -= dx * 0.005;
      player.pitch -= dy * 0.005;
      player.pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, player.pitch));
      lookX = t.clientX; lookY = t.clientY;
      e.preventDefault();
      break;
    }
  }
}, { passive: false });

const lookEnd = (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookId) { lookId = null; break; }
  }
};
renderer.domElement.addEventListener('touchend', lookEnd);
renderer.domElement.addEventListener('touchcancel', lookEnd);

/* ============================ МЫШЬ (ПК) ============================ */
let mouseHeld = false, mx = 0, my = 0;
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  mouseHeld = true; mx = e.clientX; my = e.clientY;
});
addEventListener('mouseup', () => mouseHeld = false);
addEventListener('mousemove', (e) => {
  if (!mouseHeld) return;
  const dx = e.clientX - mx, dy = e.clientY - my;
  player.yaw   -= dx * 0.004;
  player.pitch -= dy * 0.004;
  player.pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, player.pitch));
  mx = e.clientX; my = e.clientY;
});

/* ============================ БЛОКИ ============================ */
const blocks = [];
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const blockMat = new THREE.MeshStandardMaterial({ color: 0xffa500, roughness: 0.7, emissive: 0x552200, emissiveIntensity: 0.25 });
const raycaster = new THREE.Raycaster();
const centerNDC = new THREE.Vector2(0, 0);

function placeBlock() {
  raycaster.setFromCamera(centerNDC, camera);

  const targets = [ground];
  scene.traverse(obj => {
    if (obj.isMesh && obj !== ground && !targets.includes(obj) && obj !== grid) targets.push(obj);
  });

  const hits = raycaster.intersectObjects(targets, true);
  if (!hits.length) return;

  const h = hits[0];
  const nrm = h.face.normal.clone().transformDirection(h.object.matrixWorld);
  const p = h.point.clone().add(nrm.multiplyScalar(0.5));

  const gx = Math.round(p.x);
  const gy = Math.round(p.y);
  const gz = Math.round(p.z);

  // Разрешаем ставить на землю (y = 0) и выше
  if (gy < 0 || gy > 40) return;
  if (blocks.some(b => b.position.x === gx && b.position.y === gy && b.position.z === gz)) return;

  const b = new THREE.Mesh(blockGeo, blockMat);
  b.position.set(gx, gy, gz);
  b.castShadow = true;
  b.receiveShadow = true;
  scene.add(b);
  blocks.push(b);
  document.getElementById('count').textContent = blocks.length;
}

/* ============================ КНОПКА БЛОКА ============================ */
const placeBtn = document.getElementById('placeBtn');
placeBtn.addEventListener('touchstart', (e) => {
  e.preventDefault(); e.stopPropagation();
  placeBtn.classList.add('pressed');
  placeBlock();
}, { passive: false });
placeBtn.addEventListener('touchend', (e) => {
  e.preventDefault(); e.stopPropagation();
  placeBtn.classList.remove('pressed');
}, { passive: false });
placeBtn.addEventListener('mousedown', (e) => {
  e.preventDefault();
  placeBtn.classList.add('pressed');
  placeBlock();
});
placeBtn.addEventListener('mouseup', () => placeBtn.classList.remove('pressed'));

/* ============================ RESIZE ============================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================ КОЛЛИЗИИ ============================ */
function canMoveTo(x, z) {
  for (const b of blocks) {
    const dx = Math.abs(x - b.position.x);
    const dz = Math.abs(z - b.position.z);
    if (dx < 0.5 + player.radius && dz < 0.5 + player.radius) return false;
  }
  return true;
}

/* ============================ ИГРОВОЙ ЦИКЛ ============================ */
let lastT = performance.now();
let sendTimer = 0;

function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  // forward: +1 вперёд, -1 назад
  // strafe:  +1 вправо, -1 влево
  let forward = 0;
  let strafe = 0;

  if (keys.w) forward += 1;
  if (keys.s) forward -= 1;
  if (keys.d) strafe  += 1;
  if (keys.a) strafe  -= 1;

  if (joy.active) {
    forward += joy.forward;
    strafe  += joy.strafe;
  }

  const mag = Math.hypot(forward, strafe);
  if (mag > 1) { forward /= mag; strafe /= mag; }

  // ============ ДВИЖЕНИЕ ОТНОСИТЕЛЬНО ВЗГЛЯДА ============
  const speed = player.speed * dt;

  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  camDir.y = 0;
  camDir.normalize();

  const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();

  const moveX = (camDir.x * forward + camRight.x * strafe) * speed;
  const moveZ = (camDir.z * forward + camRight.z * strafe) * speed;

  const newX = player.pos.x + moveX;
  const newZ = player.pos.z + moveZ;

  if (canMoveTo(newX, player.pos.z)) player.pos.x = newX;
  if (canMoveTo(player.pos.x, newZ)) player.pos.z = newZ;

  player.pos.x = Math.max(-140, Math.min(140, player.pos.x));
  player.pos.z = Math.max(-140, Math.min(140, player.pos.z));

  // Обновление позиций других игроков (плавная интерполяция)
  for (const id in otherPlayers) {
    const p = otherPlayers[id];
    p.mesh.position.x += (p.targetX - p.mesh.position.x) * 0.2;
    p.mesh.position.z += (p.targetZ - p.mesh.position.z) * 0.2;
    p.mesh.rotation.y = p.targetYaw;
  }

  // Отправка своей позиции на сервер (30 раз в секунду)
  sendTimer += dt;
  if (isConnected && sendPosition && sendTimer > 0.033) {
    sendTimer = 0;
    sendPosition({
      x: player.pos.x,
      y: player.height,
      z: player.pos.z,
      yaw: player.yaw,
      pitch: player.pitch
    });
  }

  // Камера
  camera.position.set(player.pos.x, player.height, player.pos.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  sun.position.set(player.pos.x + 40, 60, player.pos.z + 30);
  sun.target.position.set(player.pos.x, 0, player.pos.z);
  sun.target.updateMatrixWorld();

  renderer.render(scene, camera);
}

loop();
</script>
</body>
  </html>
